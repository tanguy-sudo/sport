<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17251f">
<title>Charges — J80 · Programme sportif</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J80">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="js/pwa.js" defer></script>
</head>
<body data-page="charges">
<script src="js/layout.js"></script>
<main id="main">
<section><div class="card"><h3>Ajouter une série de travail</h3>
  <div class="formgrid">
    <div class="field"><label class="field-label" for="ex">Exercice</label><select id="ex"></select><input type="text" id="exOther" placeholder="Nom de l’exercice" maxlength="80" hidden style="margin-top:8px"></div>
    <div class="field"><label class="field-label" for="date">Date</label><input type="date" id="date"></div>
    <div class="field"><label class="field-label" for="kg">Charge (kg)</label><input type="number" id="kg" min="0" max="1000" step="0.5" inputmode="decimal"></div>
    <div class="field"><label class="field-label" for="sets">Séries</label><input type="number" id="sets" min="1" max="50" step="1" value="3" inputmode="numeric"></div>
    <div class="field"><label class="field-label" for="reps">Reps</label><input type="number" id="reps" min="1" max="500" step="1" value="8" inputmode="numeric"></div>
  </div>
  <div class="field"><label class="field-label" for="note">Note (facultatif)</label><input type="text" id="note" maxlength="120" placeholder="Ex. : dernière série difficile"></div>
  <div class="actions"><button class="btn" id="addLoad" type="button">Enregistrer</button><button class="btn secondary" id="cancelEdit" type="button" hidden>Annuler la modification</button><button class="btn secondary" id="undoDelete" type="button" hidden>↶ Annuler la suppression</button></div>
  <p id="loadFeedback" class="muted small" aria-live="polite"></p>
</div></section>
<section id="progress" hidden>
  <div class="section-head"><h2>Progression</h2></div>
  <div class="card">
    <div class="formgrid two"><div class="field"><label class="field-label" for="filter">Exercice affiché</label><select id="filter"></select></div><div class="field"><label class="field-label" for="metric">Indicateur</label><select id="metric"></select></div></div>
    <div id="chart"></div>
    <div class="phase-table"><table><thead><tr><th>Exercice</th><th>Dernière séance</th><th>Record</th><th>Dates</th></tr></thead><tbody id="summary"></tbody></table></div>
  </div>
</section>
<section>
  <div class="section-head"><h2>Historique</h2><p class="lead">Les 50 dernières entrées.</p></div>
  <div class="card"><div id="history" class="muted small"></div></div>
</section>
<section><div class="card"><h3>Sauvegarde des données</h3><p class="muted small">Tes données (jours validés, charges, bilans) restent dans ce navigateur. Exporte-les pour les sauvegarder ou les transférer vers un autre appareil.</p><div class="actions"><button class="btn secondary" id="exportAll" type="button">Exporter (.json)</button><button class="btn secondary" id="importAll" type="button">Importer…</button><input type="file" id="importFile" accept="application/json,.json" hidden></div><p id="backupFeedback" class="muted small" aria-live="polite"></p></div></section>

</main>
<script src="js/store.js"></script><script src="js/loads-core.js"></script><script src="js/charges.js"></script>
</body>
</html>
