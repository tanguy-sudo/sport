<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17251f">
<title>Séance — J80 · Programme sportif</title>
<link rel="stylesheet" href="css/style.css">
<script src="js/theme.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="J80">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="js/pwa.js" defer></script>
</head>
<body data-page="seances" data-pager="off">
<header class="hero compact"><div class="wrap"><div class="eyebrow" id="sEyebrow"></div><h1 id="sTitle">Séance</h1><p id="sTags"></p></div></header>
<script src="js/layout.js"></script>
<main id="main">
<section><div class="card">
  <p class="lead" id="sLead"></p>
  <div class="actions"><button class="btn" id="startLive" type="button">▶ Démarrer la séance</button><button class="btn secondary" id="resumeLive" type="button" hidden>↻ Reprendre la séance en cours</button></div>
  <p class="muted small">Le mode séance affiche une étape à la fois en grand, avec chronomètres, garde l’écran allumé, enregistre tes charges et valide le jour dans ton suivi.</p>
</div></section>
<section><article class="card session">
  <div class="session-top"><span class="eyebrow" style="color:#2d6a4f" id="sEyebrow2"></span><h3 id="sTitle2"></h3><span id="sTagList"></span></div>
  <div class="session-body" id="sBody"></div>
</article></section>

<div class="live" id="live" hidden role="dialog" aria-modal="true" aria-label="Séance en cours">
  <div class="live-top"><button class="btn secondary" id="liveQuit" type="button">✕ Quitter</button><div><strong id="liveStep"></strong><div class="muted small" id="liveElapsed"></div></div><button class="btn secondary" id="liveSound" type="button" aria-label="Son et vibration">🔔</button></div>
  <div class="live-bar"><div id="liveProg"></div></div>
  <div class="live-main" id="liveMain"></div>
  <div class="live-bottom"><button class="btn" id="livePrimary" type="button"></button><div class="live-row"><button class="btn secondary" id="liveBack" type="button">← Précédent</button><button class="btn secondary" id="liveAlt" type="button"></button></div></div>
</div><div class="pager" id="sPager"></div>
</main>
<script src="js/store.js"></script><script src="js/live-core.js"></script><script src="js/seance.js"></script>
</body>
</html>
